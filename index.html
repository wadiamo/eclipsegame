<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delirium MMO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, #26345a 0%, #11162b 45%, #070912 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(48px, 12vw, 100px);
      letter-spacing: 8px;
      color: #ffffff;
      text-shadow: 0 0 25px #6578ff;
    }

    .subtitle {
      text-align: center;
      margin: 5px 0 45px;
      color: #aab4d8;
      letter-spacing: 4px;
    }

    .hidden { display: none !important; }

    .panel {
      background: rgba(10, 14, 30, 0.82);
      border: 1px solid #3e4c78;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 25px 0;
    }

    button {
      border: 1px solid #53649c;
      border-radius: 12px;
      padding: 18px;
      background: #151d38;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #26345f;
      transform: translateY(-2px);
    }

    button.selected {
      border-color: #9aa8ff;
      background: #35457d;
      box-shadow: 0 0 20px rgba(120,140,255,.3);
    }

    .classes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .start {
      width: 100%;
      margin-top: 25px;
      background: #4d5fd0;
      border-color: #8491ff;
      font-size: 22px;
      font-weight: bold;
    }

    .start:hover {
      background: #6172e8;
    }

    .base-heading { margin: 0 0 10px; color: #dce2ff; text-align: center; }
    .welcome { text-align: center; color: #b9c4ff; margin: 0 0 24px; }
    .resource-grid, .building-grid, .mission-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
    .resource, .building { padding: 15px; border: 1px solid #3e4c78; border-radius: 12px; background: rgba(21, 29, 56, .8); }
    .resource strong, .building strong { display: block; margin-bottom: 6px; color: #e1e5ff; }
    .section-label { margin: 25px 0 10px; color: #aab4d8; }
    .action-button { width: 100%; font-size: 16px; padding: 14px; }
    .back-button { width: 100%; margin-top: 18px; font-size: 15px; }
    #game-message { min-height: 24px; text-align: center; color: #b9c4ff; margin-top: 16px; }

    #result {
      text-align: center;
      margin-top: 20px;
      color: #b9c4ff;
      min-height: 25px;
    }

    @media (max-width: 600px) {
      .choices,
      .classes {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="game">

    <h1>DELIRIUM</h1>
    <div class="subtitle">MMO • NOWY ŚWIAT</div>

    <section class="panel" id="start-screen">

      <h2>Wybierz rasę</h2>

      <div class="choices">
        <button onclick="chooseRace('Ludzie', this)">
          👤<br>
          <strong>LUDZIE</strong><br>
          <small>Znani. Ambitni. Niebezpieczni.</small>
        </button>

        <button onclick="chooseRace('Obcy', this)">
          👽<br>
          <strong>OBCY</strong><br>
          <small>Przybysze z nieznanego świata.</small>
        </button>
      </div>

      <h2>Wybierz klasę</h2>

      <div class="classes">
        <button onclick="chooseClass('Kreator', this)">
          🧠<br>
          KREATOR
        </button>

        <button onclick="chooseClass('Wojownik', this)">
          ⚔️<br>
          WOJOWNIK
        </button>

        <button onclick="chooseClass('Łowca', this)">
          🎯<br>
          ŁOWCA
        </button>
      </div>

      <button class="start" onclick="startGame()">
        ROZPOCZNIJ GRĘ
      </button>

      <div id="result"></div>

    </section>

    <section class="panel hidden" id="base-screen" aria-live="polite">
      <h2 class="base-heading">BAZA GŁÓWNA</h2>
      <p class="welcome" id="hero-summary"></p>
      <h3 class="section-label">ZASOBY</h3>
      <div class="resource-grid">
        <div class="resource"><strong>🔥 Ogień</strong><span>100</span></div>
        <div class="resource"><strong>💨 Powietrze</strong><span>100</span></div>
        <div class="resource"><strong>💧 Woda</strong><span>100</span></div>
        <div class="resource"><strong>🌍 Ziemia</strong><span>10 · zasób unikalny</span></div>
      </div>
      <h3 class="section-label">TWOJE BUDYNKI</h3>
      <div class="building-grid">
        <div class="building"><strong>🏛️ Centrum dowodzenia</strong><span>Poziom 1</span></div>
        <div class="building"><strong>⚒️ Koszary</strong><span>Poziom 1</span></div>
        <div class="building"><strong>🛡️ Umocnienia</strong><span>Poziom 1</span></div>
        <div class="building"><strong>🔬 Laboratorium</strong><span>Poziom 1</span></div>
      </div>
      <h3 class="section-label">DOSTĘPNE AKCJE</h3>
      <div class="mission-grid">
        <button class="action-button" onclick="showGameMessage('Misje bohatera zostaną wkrótce uruchomione.')">🧭 Misje bohatera</button>
        <button class="action-button" onclick="showGameMessage('Panel armii zostanie wkrótce uruchomiony.')">⚔️ Moja armia</button>
        <button class="action-button" onclick="showGameMessage('Budowanie zostanie wkrótce uruchomione.')">🏗️ Buduj</button>
        <button class="action-button" onclick="showGameMessage('Trening zostanie wkrótce uruchomiony.')">🎯 Trenuj</button>
      </div>
      <div id="game-message" role="status"></div>
      <button class="back-button" onclick="returnToSelection()">Zmień postać</button>
    </section>

  </main>

  <script>
    let selectedRace = null;
    let selectedClass = null;

    function chooseRace(race, button) {
      selectedRace = race;

      document.querySelectorAll('.choices button')
        .forEach(b => b.classList.remove('selected'));

      button.classList.add('selected');

      updateResult();
    }

    function chooseClass(characterClass, button) {
      selectedClass = characterClass;

      document.querySelectorAll('.classes button')
        .forEach(b => b.classList.remove('selected'));

      button.classList.add('selected');

      updateResult();
    }

    function updateResult() {
      if (selectedRace && selectedClass) {
        document.getElementById('result').textContent =
          'Wybrano: ' + selectedRace + ' — ' + selectedClass;
      }
    }

    function startGame() {
      if (!selectedRace || !selectedClass) {
        document.getElementById('result').textContent =
          'Najpierw wybierz rasę i klasę postaci.';
        return;
      }

      document.getElementById('hero-summary').textContent =
        'Bohater: ' + selectedRace + ' — ' + selectedClass;
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('base-screen').classList.remove('hidden');
      document.getElementById('game-message').textContent =
        'Witaj w świecie! Twoja przygoda właśnie się zaczyna.';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function returnToSelection() {
      document.getElementById('base-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
      document.getElementById('result').textContent = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showGameMessage(message) {
      document.getElementById('game-message').textContent = message;
    }
  </script>

</body>
</html>
